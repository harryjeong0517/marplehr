<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MARPLE HR</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%23009DDF%22/%3E%3Crect%20x%3D%229%22%20y%3D%2222%22%20width%3D%2246%22%20height%3D%2220%22%20rx%3D%2210%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%226%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* MARPLE HR — MARFLOW(MARPLE VENUE) 디자인 토큰 기준, 라이트 전용 */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --sunken:#eef0f4; --bg3:#f6f7f9; --line:#e6e8ec; --line2:#f0f1f4; --border2:#d5d9e0;
  --ink:#16191f; --muted:#5b6474; --text2:#4b5563; --text3:#8a93a3;
  --accent:#009BDF; --accent-ink:#007db8; --accent-soft:#e3f4fc; --btn:#007db8; --on-btn:#ffffff;
  --qual:#0f1a2e; --navy:#0f1a2e;
  --good:#15803d; --good-soft:#e5f6ea; --warn:#d97706; --warn-soft:#fff4e0; --bad:#c62828; --bad-soft:#fdeaea;
  --side:#000000; --side2:#1f2937; --side-text:#cbd2dc;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --font:Pretendard,-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;
  --num:Pretendard,-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;
  --r:10px; color-scheme:light;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;word-break:keep-all;overflow-wrap:anywhere}
h1,h2,h3,p{margin:0}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:15px;font-weight:700}
h3{font-size:13px;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.n{font-family:var(--num);font-variant-numeric:tabular-nums}
.dim{color:var(--muted)}

main{min-width:0;display:flex;flex-direction:column;gap:20px}

.vh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap}
.vh p{color:var(--muted);margin-top:2px;max-width:64ch}
.va{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.strip{padding:9px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-weight:500;display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap}
.strip.info{background:var(--accent-soft);color:var(--accent-ink)}
.strip .sp{flex:1}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--btn);border-color:var(--btn);color:var(--on-btn);font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad-soft);background:var(--bad-soft)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.55;cursor:default}
.link{background:none;border:0;padding:0;color:var(--accent-ink);font-weight:700;cursor:pointer;text-align:left}
.link:hover{text-decoration:underline}
.inl{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
select,input,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;max-width:100%}
textarea{width:100%;resize:vertical;line-height:1.5}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel>h2{margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.panel>h2 small{font-weight:400;color:var(--muted);font-size:12.5px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px}
.kpi span{display:block;color:var(--muted);font-size:12.5px}
.kpi b{font-family:var(--num);font-size:28px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi b i{font-style:normal;font-size:14px;color:var(--muted);font-weight:500;margin-left:2px}
.kpi small{color:var(--muted)}

.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.todo li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.todo li:first-child{border-top:0;padding-top:0}
.todo .t{min-width:0}
.todo .t small{display:block;color:var(--muted)}

.pill{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:700;background:var(--sunken);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.ex{background:transparent;border:1px dashed var(--line);font-weight:500}
.g{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;font-family:var(--num);font-weight:700;font-size:13px;background:var(--sunken);color:var(--muted)}
.g-S,.g-A{background:var(--good-soft);color:var(--good)}
.g-B{background:var(--accent-soft);color:var(--accent-ink)}
.g-C{background:var(--warn-soft);color:var(--warn)}
.g-D{background:var(--bad-soft);color:var(--bad)}

.scroll{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{border-collapse:collapse;width:100%;min-width:560px}
th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:6px 10px 8px 0;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px 9px 0;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.sbar{display:flex;align-items:center;gap:8px;min-width:120px}
.bar{flex:1;height:8px;border-radius:4px;background:var(--sunken);position:relative;overflow:hidden;min-width:56px}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--accent)}
.bar i.ql{background:var(--qual)}
.bar i.tt{background:var(--ink)}
.sbar b{font-family:var(--num);font-variant-numeric:tabular-nums;font-weight:500;width:40px;text-align:right}

.orow{display:grid;grid-template-columns:minmax(84px,130px) minmax(0,1fr);gap:6px 14px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.orow:first-of-type{border-top:0}
.orow .ob{display:flex;align-items:center;gap:8px}
.orow .ob span{width:64px;font-size:12px;color:var(--muted);flex:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;background:var(--accent);vertical-align:-1px}
.legend i.ql{background:var(--qual)} .legend i.tt{background:var(--ink)}
.dist{display:grid;grid-template-columns:28px minmax(0,1fr) 34px;gap:8px 10px;align-items:center}

.tabs{display:inline-flex;background:var(--sunken);border-radius:9px;padding:3px;gap:2px}
.tabs button{border:0;background:transparent;border-radius:7px;padding:5px 14px;font-weight:500;color:var(--muted);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700}

.ocards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.ocard{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface);display:flex;flex-direction:column;gap:4px;text-align:left;cursor:pointer}
.ocard:hover{border-color:var(--muted)}
.ocard[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.ocard b{font-size:14.5px}
.ocard small{color:var(--muted)}

.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px}
.stage{background:var(--sunken);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.stage h3{display:flex;justify-content:space-between;color:var(--muted)}
.cand{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;display:flex;flex-direction:column;gap:6px}
.cand .mv{display:flex;gap:6px;justify-content:space-between;align-items:center}
details{border-top:1px solid var(--line);padding:10px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:700}
details ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
details li span{color:var(--muted);font-size:12px;font-weight:700;margin-right:6px}

.ob-head{display:flex;justify-content:space-between;gap:10px 16px;align-items:center;flex-wrap:wrap}
.prog{display:flex;align-items:center;gap:8px;min-width:160px}
.phase{margin-top:14px}
.phase h3{display:flex;justify-content:space-between;gap:8px;color:var(--muted);padding-bottom:6px;border-bottom:1px solid var(--line)}
.chk{display:flex;gap:9px;align-items:flex-start;padding:6px 0;cursor:pointer}
.chk input{margin-top:3px;flex:none;width:16px;height:16px;accent-color:var(--btn)}
.chk.on span{color:var(--muted);text-decoration:line-through}

.pol{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.pol article{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px}
.pol p{white-space:pre-wrap;max-width:65ch}

.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--ink);font-size:15px}

.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:min(100%,72ch);padding:10px 13px;border-radius:12px;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--accent-soft);color:var(--ink)}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;cursor:pointer;text-align:left}
.chips button:hover{border-color:var(--accent)}
.aiform{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.aiform textarea{flex:1;min-width:200px}
.fine{font-size:12px;color:var(--muted);max-width:70ch}

dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 32px)}
dialog.wide{width:min(860px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(8,16,26,.55)}
.form{display:flex;flex-direction:column;max-height:calc(100vh - 34px)}
.form>header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.form>header p{color:var(--muted);font-size:13px}
.form .body{padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.form>footer{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line)}
.form>footer .sp{flex:1}
.x{border:0;background:transparent;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:0 4px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;grid-column:1/-1;min-width:0}
.fld.half{grid-column:auto}
.fld>span{font-size:12.5px;color:var(--muted);font-weight:500}
.fld small{color:var(--muted);font-size:12px}
.fld input,.fld select{width:100%}
@media (max-width:520px){.fld.half{grid-column:1/-1}}

.evsum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.evsum div{background:var(--sunken);padding:8px 12px}
.evsum span{display:block;font-size:12px;color:var(--muted)}
.evsum b{font-family:var(--num);font-size:20px;font-variant-numeric:tabular-nums}
.sec h3{margin-bottom:8px;display:flex;justify-content:space-between;gap:8px;color:var(--muted)}
.qrow{display:grid;grid-template-columns:minmax(0,1.6fr) 92px 92px 56px;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.qrow.hd{border-top:0;font-size:12px;color:var(--muted);padding:0 0 4px}
.qrow input{width:100%;text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums}
.qrow small{display:block;color:var(--muted);font-size:12px}
.qrow output{text-align:right;font-family:var(--num);font-weight:700;font-variant-numeric:tabular-nums}
.lrow{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:7px}
.lrow .top{display:flex;justify-content:space-between;gap:10px 14px;align-items:center;flex-wrap:wrap}
.lrow small{color:var(--muted);font-size:12px;display:block}
.rate{display:inline-flex;gap:4px}
.rate button{width:34px;height:30px;border:1px solid var(--line);background:var(--surface);border-radius:7px;font-family:var(--num);font-weight:700;cursor:pointer}
.rate button[aria-pressed="true"]{background:var(--qual);border-color:var(--qual);color:var(--surface)}
.err{color:var(--bad);font-weight:500;font-size:13px}
@media (max-width:560px){.qrow{grid-template-columns:minmax(0,1fr) 70px 70px 46px}.evsum{grid-template-columns:repeat(2,minmax(0,1fr))}}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:500;z-index:50;max-width:calc(100vw - 32px)}
#toast.bad{background:var(--bad);color:#fff}

.cal{display:grid;grid-template-columns:repeat(7,minmax(92px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;min-width:660px}
.cal .dh{background:var(--sunken);padding:5px 8px;font-size:12px;color:var(--muted);font-weight:500}
.cal .dc{background:var(--surface);min-height:76px;padding:5px 6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .dc.out{background:var(--bg)}
.cal .dn{font-family:var(--num);font-size:12px;font-variant-numeric:tabular-nums;align-self:flex-start;min-width:20px;text-align:center;border-radius:99px;padding:0 4px}
.cal .we .dn{color:var(--muted)}
.cal .td .dn{background:var(--btn);color:var(--on-btn);font-weight:700}
.lv{font-size:11.5px;border-radius:4px;padding:1px 5px;background:var(--accent-soft);color:var(--accent-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv.etc{background:var(--sunken);color:var(--ink)}
.lv.pd{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
.calnav{display:flex;align-items:center;gap:8px}
.calnav b{font-family:var(--num);font-size:15px;min-width:86px;text-align:center}
.ro [data-act="stageSet"],.ro [data-act="cycleSet"],.ro [data-act="compSeed"],.ro [data-act="leaveSet"],.ro [data-act$="New"],.ro [data-act$="Edit"]:not([data-act="candEdit"]),.ro [data-act="candMove"],.ro [data-act="purge"],.ro [data-save],.ro #fsave,.ro #fdel{display:none!important}
.ro .chk{cursor:default}.ro .chk input{pointer-events:none}

@media (prefers-reduced-motion:no-preference){.bar i{transition:width .35s ease}}

/* flex 구조 반영: 묶음 메뉴, 밑줄 탭, 모듈 전용 보조 메뉴, 단계형 설정 창 */
.ptabs{display:flex;gap:20px;border-bottom:1px solid var(--line);overflow-x:auto}
.ptabs button{border:0;background:none;padding:6px 0 9px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.ptabs button:hover{color:var(--ink)}
.ptabs button[aria-pressed="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.pill.acc{background:var(--accent-soft);color:var(--accent-ink)}
.sub{display:grid;grid-template-columns:172px minmax(0,1fr);gap:20px;align-items:start}
.subnav{display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px)}
.subnav h3{color:var(--muted);font-size:11px;letter-spacing:.06em;padding:10px 10px 3px}
.subnav h3:first-child{padding-top:0}
.subnav button{border:0;background:none;text-align:left;padding:7px 10px;border-radius:8px;color:var(--muted);font-weight:500;cursor:pointer;white-space:nowrap}
.subnav button:hover{background:var(--sunken);color:var(--ink)}
.subnav button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:inset 0 0 0 1px var(--line)}
.subbody{display:flex;flex-direction:column;gap:20px;min-width:0}
.dot{display:inline-flex;align-items:center;gap:6px;font-weight:500;white-space:nowrap;color:var(--muted)}
.dot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted);opacity:.55}
.dot.run{color:var(--accent-ink)}.dot.run::before{background:var(--accent);opacity:1}
.dot.end{color:var(--good)}.dot.end::before{background:var(--good);opacity:1}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);font-size:11.5px;font-weight:700;flex:none}
.who{display:inline-flex;align-items:center;gap:9px;min-width:0;vertical-align:middle}
.who small{display:block;color:var(--muted);font-size:12px}
.tree,.tree ul{list-style:none;margin:0;padding:0}
.tree ul{margin-left:16px;padding-left:16px;border-left:1px solid var(--line)}
.tree li{padding-top:12px}
.tree>li{padding-top:0}
.onode{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.onode.root{background:var(--sunken);border-color:transparent}
.onode .mem{display:flex;gap:10px 22px;flex-wrap:wrap}
.rcell{border:1px solid transparent;background:none;border-radius:8px;padding:4px 7px;cursor:pointer;display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.rcell:hover{border-color:var(--line);background:var(--sunken)}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--sunken);min-width:80px;margin-bottom:4px}
.stack i{display:block;height:100%}
.stack i.sg-S,.legend i.sg-S{background:var(--good)}
.stack i.sg-A,.legend i.sg-A{background:var(--good);opacity:.5}
.stack i.sg-B,.legend i.sg-B{background:var(--accent)}
.stack i.sg-C,.legend i.sg-C{background:var(--warn)}
.stack i.sg-D,.legend i.sg-D{background:var(--bad)}
.gtree td:first-child{min-width:240px}
.wz{display:grid;grid-template-columns:184px minmax(0,1fr);grid-template-rows:minmax(0,1fr);flex:1;min-height:min(440px,60vh);overflow:hidden}
.wz>.body{min-height:0}
.wzs{border-right:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;gap:2px;overflow:auto;background:var(--bg)}
.wzs button{display:flex;gap:9px;align-items:center;border:0;background:none;text-align:left;padding:7px 9px;border-radius:8px;color:var(--muted);font-weight:500;cursor:pointer;white-space:nowrap}
.wzs button .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--sunken);font-size:11.5px;font-weight:700;flex:none}
.wzs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:inset 0 0 0 1px var(--line)}
.wzs button[aria-pressed="true"] .n{background:var(--btn);color:var(--on-btn)}
.crow{display:grid;grid-template-columns:minmax(0,1fr) 76px;gap:10px;align-items:center;border-top:1px solid var(--line)}
.crow:first-of-type{border-top:0}
.crow input[type="number"]{width:100%;text-align:right;font-family:var(--num)}

function quantRate(m,v){
  if(!v||v.target===''||v.target==null||v.actual===''||v.actual==null) return null;
  const t=+v.target, a=+v.actual; if(isNaN(t)||isNaN(a)) return null;
  let r;
  if(m.dir==='down'){ r = a<=0 ? 1.2 : t/a; }
  else { if(t<=0) return null; r=a/t; }
  return Math.max(0,Math.min(1.2,r));
}
function scoreEval(ev,scope,cyc){
  const ms=S.metrics.filter(m=>m.scope===scope&&m.active!==false);
  let qs=0,qw=0,ls=0,lw=0,filled=0;
  for(const m of ms){
    const w=+m.weight||0;
    if(m.kind==='quant'){ const r=quantRate(m,ev?.quant?.[m.id]); if(r!=null){qs+=r*100*w;qw+=w;filled++;} }
    else { const sc=+ev?.qual?.[m.id]?.score; if(sc>=1){ls+=sc*20*w;lw+=w;filled++;} }
  }
  const quant=qw?qs/qw:null, qual=lw?ls/lw:null, k=(cyc?.quantWeight??60)/100;
  const total=(quant!=null&&qual!=null)?quant*k+qual*(1-k):(quant??qual);
  return {quant,qual,total,filled,count:ms.length,complete:ms.length>0&&filled===ms.length};
}

function compsFor(c,p){ const sel=c?.comps||{}; return S.competencies.filter(k=>sel[k.id]!=null&&(k.type!=='리드'||(p&&isLead(p)))).sort((a,b)=>CTYPES.indexOf(a.type)-CTYPES.indexOf(b.type)||(a.order??99)-(b.order??99)); }
const revId = (c,st,pid)=>`${c.id}_${st}_${pid}`;

function revScore(c,rv,p){ const cs=compsFor(c,p), vals=[]; let s=0,w=0; for(const k of cs){ const v=+rv?.scores?.[k.id]; if(v>=1){ const wt=+c.comps[k.id]||0; s+=v*20*wt; w+=wt; vals.push(v*20); } } return {score:w?s/w:mean(vals),filled:vals.length,count:cs.length}; }

  if(c.compMethod!=='avg'&&stOn(c,'down')) return sc('down');

const mergeDeep=(a,b)=>{ for(const k in b){ const v=b[k]; if(v&&typeof v==='object'&&!Array.isArray(v)&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k])) mergeDeep(a[k],v); else a[k]=v; } return a; };

async function storeSet(col,item){
  const i=S[col].findIndex(x=>x.id===item.id), prev=i>=0?S[col][i]:null;
  if(i>=0) S[col][i]=item; else S[col].push(item);
  commit();
  try{ await remote({action:'upsert',sheet:col,item}); }
  catch(e){ const k=S[col].findIndex(x=>x.id===item.id); if(k>=0){ if(prev) S[col][k]=prev; else S[col].splice(k,1); } commit(); throw e; }
}

    <label class="fld"><span>보안 키 (Apps Script의 API_KEY와 동일하게)</span><input id="cfgKey" type="password" value="${esc(CFG.key||'')}" autocomplete="off"><small>키가 맞으면 이 브라우저에서 수정할 수 있습니다. 비워 두면 보기 전용입니다.</small></label></div>
    <p id="cfgMsg" class="fine" role="status"></p><div id="cfgMore" class="va"></div>
  </div><footer><button type="button" class="btn" id="cfgTest">연결 확인</button><span class="sp"></span><button type="button" class="btn ghost" data-act="close">취소</button><button class="btn primary" id="cfgSave">저장하고 연결</button></footer></form>`);
  const msg=(t,cls)=>{ const m=$('#cfgMsg'); if(m){ m.className='fine'+(cls?' '+cls:''); m.textContent=t; } };
  const vals=()=>({url:$('#cfgUrl').value.trim(),key:$('#cfgKey').value.trim()});
  const badUrl=u=>!/^https:\/\/|^http:\/\/(localhost|127\.0\.0\.1)[:/]/.test(u);
  $('#cfgTest').onclick=async()=>{ const {url,key}=vals();
    if(!url){ msg('URL을 입력해 주세요.','cfg-bad'); return; }
    if(badUrl(url)){ msg('https://script.google.com/macros/s/…/exec 형태의 웹앱 주소를 넣어 주세요.','cfg-bad'); return; }
    msg('연결 확인 중…');
    try{ const j=await gasPost(url,{action:'ping',key}); msg(`연결 성공${j.sheetName?' · 스프레드시트: '+j.sheetName:''} · ${j.canWrite?'수정 가능':'보기 전용 (키가 없거나 다릅니다)'}`,'cfg-ok'); }
    catch(e){ msg('연결 실패: '+e.message,'cfg-bad'); } };
  $('#cfgForm').addEventListener('submit',async e=>{ e.preventDefault(); const {url,key}=vals(), b=$('#cfgSave'), u=url||HR_DEFAULT_GAS;
    if(!u){ CFG.gasUrl=''; CFG.key=''; saveCfg(); loadState='local'; syncErr=''; setRo(false); closeDlg(); render(); toast('이 브라우저에만 저장합니다'); return; }
    if(badUrl(u)){ msg('https://script.google.com/macros/s/…/exec 형태의 웹앱 주소를 넣어 주세요.','cfg-bad'); return; }
    b.disabled=true; msg('연결하는 중…');
    try{ const p=await gasPost(u,{action:'ping',key}), r=await gasPost(u,{action:'getAll',key});
      const local=clone(snapshot()), ln=countAll(local), rn=countAll(r.data);
      const use=()=>{ CFG.gasUrl=url; CFG.key=key; saveCfg(); loadState='ready'; syncErr=''; setRo(!p.canWrite); };
      if(wasLocal&&p.canWrite&&!rn&&ln){
        msg(`연결했습니다. 시트는 비어 있고, 이 브라우저에는 데이터 ${ln}건이 있습니다.`,'cfg-ok');
        $('#cfgMore').innerHTML='<button type="button" class="btn primary" id="cfgUp">이 데이터를 시트로 올리기</button><button type="button" class="btn" id="cfgEmpty">빈 시트로 시작</button>';
        $('#cfgUp').onclick=async ev=>{ ev.currentTarget.disabled=true; msg('시트로 올리는 중…');
          try{ await gasPost(u,{action:'importAll',data:local,key}); use(); lastJson=''; closeDlg(); render(); toast(`${ln}건을 시트로 올렸습니다`); }
          catch(er){ msg('올리지 못했습니다: '+er.message,'cfg-bad'); ev.target.disabled=false; } };
        $('#cfgEmpty').onclick=()=>{ use(); adopt({}); lastJson=''; saveLocal(); closeDlg(); render(); toast('빈 시트로 시작합니다'); };
        return; }
      use(); adopt(r.data); lastJson=JSON.stringify(r.data||{}); saveLocal(); closeDlg(); render();
      toast(p.canWrite?'구글 시트에 연결했습니다':'보기 전용으로 연결했습니다');
    }catch(err){ msg('연결 실패: '+err.message,'cfg-bad'); b.disabled=false; } });
}

function orgChart(){
  const kids=id=>S.orgs.filter(o=>o.parent===id);
  const card=p=>who(p,esc(p.title||'')+(S.orgs.some(o=>o.lead===p.id&&o.id===p.orgId)?' · 조직장':''));
  const node=(o,depth)=>{ if(depth>6) return '';
    const mem=S.people.filter(p=>p.orgId===o.id&&p.status!=='퇴사').sort((a,b)=>(b.id===o.lead)-(a.id===o.lead)||String(a.joined||'').localeCompare(String(b.joined||'')));

    return `<li><div class="onode"><div class="va" style="justify-content:space-between"><div><b>${esc(o.name)}</b>${exTag(o)} <small class="dim">${mem.length}명</small></div><button class="btn sm" data-act="orgEdit" data-id="${o.id}">수정</button></div><div class="mem">${mem.map(card).join('')||'<span class="dim">구성원 없음</span>'}</div></div>${sub.length?`<ul>${sub.map(x=>node(x,depth+1)).join('')}</ul>`:''}</li>`; };

}

function leaveForm(l){

    {k:'personId',label:'구성원',type:'select',options:[['','선택하세요'],...S.people.filter(x=>x.status!=='퇴사'||x.id===l?.personId).map(x=>[x.id,x.name])],half:1},
    {k:'type',label:'종류',type:'select',options:LTYPES.map(x=>[x[0],x[0]]),half:1},
    {k:'start',label:'시작일',type:'date',required:1,half:1},{k:'end',label:'종료일',type:'date',half:1,hint:'반차는 시작일 하루만 적용됩니다'},
    {k:'days',label:'일수',type:'number',half:1,hint:'비워 두면 주말을 빼고 자동 계산'},{k:'status',label:'상태',type:'select',options:[['신청','신청 (승인 대기)'],['승인','승인'],['반려','반려']],half:1},
    {k:'reason',label:'사유'}],
  onSave:async v=>{
    if(!v.personId){ toast('구성원을 선택하세요',1); throw 0; }
    if(!v.end||v.end<v.start) v.end=v.start;
    if(v.type.includes('반차')){ v.end=v.start; v.days=0.5; }
    else if(v.days===''||!(v.days>0)) v.days=bizDays(v.start,v.end);
    if(!(v.days>0)){ toast('주말만 선택됐습니다. 날짜를 확인하세요',1); throw 0; }
    const id=l?.id||('l'+uid()); await put('leaves',id,{...strip(l||{}),...v,created:l?.created||today()});
    const pp=by(S.people,v.personId); if(pp&&deducts(v.type)&&v.status!=='반려'){ const s=leaveStat(pp); const extra=by(S.leaves,id)?0:v.days; if(s.left-s.pend-extra<0) toast('저장했습니다. 잔여 연차를 넘는 신청입니다',1); }
  },
  onDelete:l?()=>del('leaves',l.id):null}); }

const STN = {ready:['시작 전',''],run:['진행 중',' run'],end:['마감',' end']};

function curStage(c){ if(c.status==='마감') return '없음'; const s=STG.find(x=>stOn(c,x[0])&&stState(c,x[0])==='run'); return s?s[1]:c.usePerf!==false?'성과 평가':'없음'; }

    h+='</section>';

    h+=`<section class="panel"><h2>성과 지표 <span><a class="btn sm" href="#metrics">성과 지표 관리</a></span></h2>${c.usePerf===false?'<p class="dim">이 평가는 성과 평가를 쓰지 않습니다.</p>':ms.length?`<div class="scroll"><table><thead><tr><th>종류</th><th>지표</th><th>설명</th><th class="r">가중치</th></tr></thead><tbody>${ms.map(m=>`<tr><td><span class="pill${m.kind==='quant'?' acc':''}">${m.kind==='quant'?'정량':'정성'}</span></td><td><b>${esc(m.name)}</b></td><td>${esc(m.desc||'')}${m.kind==='quant'&&m.unit?' · 단위 '+esc(m.unit):''}</td><td class="r n">${+m.weight||0}</td></tr>`).join('')}</tbody></table></div>`:'<p class="dim">사용 중인 성과 지표가 없습니다.</p>'}</section>`;
    return h;
  },
  comp(c,rows){
    if(!c.useComp) return empty('역량 평가를 쓰지 않는 평가입니다','설정 2단계에서 역량과 단계(셀프·동료·하향)를 켜면 여기에서 진행 현황을 관리합니다.',`<button class="btn primary" data-act="cycleEdit" data-id="${c.id}">설정 열기</button>`);
    const on=STG.filter(s=>stOn(c,s[0]));
    if(!on.length) return empty('켜진 평가 단계가 없습니다','설정 2단계에서 셀프, 동료, 하향 평가 중 쓸 단계를 고르세요.',`<button class="btn primary" data-act="cycleEdit" data-id="${c.id}">설정 열기</button>`);
    const cell=(k,p)=>{ const rv=getRev(c,k,p.id), s=rv?revScore(c,rv,p):null;
      return `<button class="rcell" data-act="revOpen" data-st="${k}" data-id="${p.id}">${!rv?'<span class="pill">미제출</span>':rv.status==='done'?`<span class="pill good">제출</span><span class="n">${fmt(s.score)}</span>`:`<span class="pill warn">작성 중</span><span class="n dim">${s.filled}/${s.count}</span>`}</button>`; };
    return `<section class="panel"><h2>역량 평가 현황 <small>칸을 누르면 평가지가 열립니다</small></h2><div class="scroll"><table style="min-width:${380+on.length*150}px"><thead><tr><th>이름</th>${on.map(([k,l])=>`<th>${l} · ${STN[stState(c,k)][0]}</th>`).join('')}<th>역량 점수</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${who(r.p,posOf(r.p))}</td>${on.map(([k])=>`<td>${cell(k,r.p)}</td>`).join('')}<td>${sbar(r.sc.comp,'ql')}</td></tr>`).join('')}</tbody></table></div><p class="fine" style="margin-top:10px">역량 점수는 ${c.compMethod!=='avg'&&stOn(c,'down')?'제출된 하향 평가 점수':'제출된 단계의 평균'}입니다. 이 사이트는 편집 권한이 있는 사람만 입력할 수 있어, 셀프·동료 평가도 관리자가 받아서 옮겨 적습니다.</p></section>`;
  },
  perf(c){
    if(c.usePerf===false) return empty('성과 평가를 쓰지 않는 평가입니다','설정 2단계에서 성과를 켤 수 있습니다.',`<button class="btn primary" data-act="cycleEdit" data-id="${c.id}">설정 열기</button>`);
    const isP=ui.evalTab==='person', rows=isP?personRows(c):orgRows(c), pv=r=>'perf' in r.sc?r.sc.perf:r.sc.total;
    let h=`<div class="va" style="justify-content:space-between"><div class="tabs"><button data-act="evalTab" data-v="person" aria-pressed="${isP}">구성원 ${personRows(c).length}</button><button data-act="evalTab" data-v="org" aria-pressed="${!isP}">조직 ${S.orgs.length}</button></div><div class="legend"><span><i></i>정량 ${c.quantWeight??60}%</span><span><i class="ql"></i>정성 ${100-(c.quantWeight??60)}%</span></div></div><section class="panel">`;
    if(!rows.length) h+=empty(isP?'평가할 구성원이 없습니다':'평가할 조직이 없습니다','구성원 메뉴에서 먼저 등록하세요.','<a class="btn primary" href="#org">등록하러 가기</a>');
    else{
      const sorted=[...rows].sort((a,b)=>(pv(b)??-1)-(pv(a)??-1));
      h+=`<div class="scroll"><table style="min-width:720px"><thead><tr><th>${isP?'구성원':'조직'}</th>${isP?'':'<th>구성원 평균</th>'}<th>정량</th><th>정성</th><th class="r">성과 점수</th><th>등급</th><th>상태</th><th></th></tr></thead><tbody>`+sorted.map(r=>{const t=isP?r.p:r.o;
        return `<tr><td>${isP?who(t,posOf(t)):`<b>${esc(t.name)}</b>${exTag(t)}<br><small class="dim">${r.members}명</small>`}</td>${isP?'':`<td><span class="n">${fmt(r.memAvg)}</span></td>`}<td>${sbar(r.sc.quant)}</td><td>${sbar(r.sc.qual,'ql')}</td><td class="r n"><b>${fmt(pv(r))}</b></td><td>${gpill(pv(r),c)}</td><td>${stPill(r.ev)}<br><small class="dim">${r.sc.filled}/${r.sc.count} 입력</small></td><td class="r"><button class="btn sm${r.ev?.status==='done'?'':' primary'}" data-act="evalOpen" data-type="${isP?'person':'org'}" data-id="${t.id}">${ro?'보기':r.ev?.status==='done'?'보기·수정':'평가하기'}</button></td></tr>`;}).join('')+'</tbody></table></div>';
    }
    return h+'</section>';
  },
  result(c,rows){
    const G=GR(c), scored=rows.filter(r=>r.sc.total!=null), n=scored.length, gOf=r=>grade(r.sc.total,c);
    const sg=(v,cls)=>v==null?'<span class="dim">–</span>':`<span class="va" style="flex-wrap:nowrap">${sbar(v,cls)}${gpill(v,c)}</span>`;
    let h=`<div class="cols"><section class="panel"><h2>전체 등급 분포 <small>종합 등급 ${n}명</small></h2>${n?`<div class="dist" style="grid-template-columns:28px minmax(0,1fr) auto">${G.map(g=>{ const k=scored.filter(r=>gOf(r)===g[0]).length, pc=k/n*100, cap=c.useDist&&c.dist?.[g[0]]!==''&&c.dist?.[g[0]]!=null?+c.dist[g[0]]:null, over=cap!=null&&pc>cap+1e-9;
      return `<span class="g g-${g[0]}">${g[0]}</span><span class="bar"><i class="tt" style="width:${pc.toFixed(0)}%"></i></span><span class="n">${k}명 · ${Math.round(pc)}%${cap!=null?` <small class="${over?'err':'dim'}">최대 ${cap}%${over?' 초과':''}</small>`:''}</span>`; }).join('')}</div>`:'<p class="dim">점수가 입력되면 분포가 보입니다.</p>'}</section>`;
    h+=`<section class="panel"><h2>조직별 등급 분포</h2>${S.orgs.map(o=>{ const rs=scored.filter(r=>r.p.orgId===o.id), ks=G.map(g=>[g[0],rs.filter(r=>gOf(r)===g[0]).length]).filter(x=>x[1]);
      return `<div class="orow"><div><b>${esc(o.name)}</b><br><small class="dim">${rs.length}명</small></div><div>${rs.length?`<div class="stack">${ks.map(x=>`<i class="sg-${x[0]}" style="width:${x[1]/rs.length*100}%"></i>`).join('')}</div><small class="dim">${ks.map(x=>x[0]+' '+x[1]+'명').join(' · ')}</small>`:'<span class="dim">점수 없음</span>'}</div></div>`; }).join('')||'<p class="dim">조직이 없습니다.</p>'}<div class="legend" style="margin-top:10px">${G.map(g=>`<span><i class="sg-${g[0]}"></i>${g[0]}</span>`).join('')}</div></section></div>`;
    h+=`<section class="panel"><h2>평가 결과 <small>${c.useComp&&c.usePerf!==false?`성과 ${c.perfWeight??70}% + 역량 ${100-(c.perfWeight??70)}%`:c.useComp?'역량 점수 기준':'성과 점수 기준'}</small></h2>${rows.length?`<div class="scroll"><table style="min-width:760px"><thead><tr><th>이름</th><th>역량</th><th>성과</th><th class="r">종합 점수</th><th>종합 등급</th></tr></thead><tbody>${[...rows].sort((a,b)=>(b.sc.total??-1)-(a.sc.total??-1)).map(r=>`<tr><td>${who(r.p,posOf(r.p))}</td><td>${sg(r.sc.comp,'ql')}</td><td>${sg(r.sc.perf,'')}</td><td class="r n"><b>${fmt(r.sc.total)}</b></td><td>${gpill(r.sc.total,c)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="dim">대상자가 없습니다.</p>'}</section>`;
    h+=`<section class="panel"><h2>등급 체계 <small>종합 점수 기준</small></h2><div class="scroll"><table><tbody>${G.map((g,i)=>`<tr><td style="width:44px"><span class="g g-${g[0]}">${g[0]}</span></td><td class="n" style="width:150px">${g[1]}점 이상${i?` ~ ${G[i-1][1]}점 미만`:''}</td><td>${esc(g[2])}</td>${c.useDist?`<td class="r n dim">최대 ${esc(c.dist?.[g[0]]??'–')}%</td>`:''}</tr>`).join('')}</tbody></table></div></section>`;
    return h;
  },
};

/* 평가 만들기·설정: flex와 같은 8단계 */

  const B=[
    ()=>{ const n=activePeople().filter(p=>inScope(w,p)).length;

    ()=>`<div class="sec"><h3>평가 요소</h3>${chk('useComp',w.useComp,'역량','역량 관리에 등록한 항목을 5점 척도로 평가합니다')}${chk('usePerf',w.usePerf,'성과','성과 지표의 목표 대비 실적(정량)과 5점 척도(정성)로 평가합니다')}</div>

      <div class="sec"><h3>종합 점수</h3><div class="scroll"><table style="min-width:420px"><tbody><tr><td style="width:96px"><b>역량 점수</b></td><td>역량별 5점 척도 × 20을 가중 평균합니다 (5점 = 100점)</td></tr><tr><td><b>성과 점수</b></td><td>정량 달성률과 정성 점수를 ${qw} : ${100-qw}으로 합칩니다</td></tr><tr><td><b>종합 점수</b></td><td>성과 ${pw}% + 역량 ${100-pw}%. 이 점수로 등급을 냅니다</td></tr></tbody></table></div></div>`; },
    ()=>`<div class="sec"><h3>등급 체계 <span>종합 점수가 기준 점수 이상이면 그 등급</span></h3>${GRADES.map(([g])=>`<div class="grow"><span class="g g-${g}">${g}</span>${g==='D'?'<span class="n dim">0점 이상</span>':wi('grades.'+g+'.min','number',w.grades[g].min,`aria-label="${g} 기준 점수"`)}${wi('grades.'+g+'.desc','text',w.grades[g].desc,`aria-label="${g} 설명"`)}</div>`).join('')}</div>`,
    ()=>`<div class="sec"><h3>등급 배분</h3>${chk('useDist',w.useDist,'등급별 최대 인원 비율 사용','상대 평가로 운영할 때 켭니다. 비율을 넘으면 평가 결과 화면에 표시합니다. 등급을 자동으로 바꾸지는 않습니다')}${w.useDist?GRADES.map(([g])=>`<div class="grow"><span class="g g-${g}">${g}</span>${wi('dist.'+g,'number',w.dist[g],`min="0" max="100" aria-label="${g} 최대 비율"`)}<span class="dim">% 이하</span></div>`).join(''):''}</div>`,
  ];
  const fail=(i,m)=>{ step=i; paint(); const e=$('#wErr'); e.textContent=m; e.hidden=false; };
  async function save(sb){
    if(!String(w.name||'').trim()) return fail(0,'평가 제목을 입력하세요.');
    const mins=['S','A','B','C'].map(g=>+w.grades[g].min);
    if(mins.some((m,i)=>isNaN(m)||w.grades[['S','A','B','C'][i]].min===''||m<=0||(i&&m>=mins[i-1]))) return fail(6,'등급 기준 점수는 S부터 C까지 높은 순서로 입력하세요.');
    const pc=(v,d)=>v===''||v==null||isNaN(+v)?d:Math.max(0,Math.min(100,+v));
    const out={...w,name:String(w.name).trim(),perfWeight:pc(w.perfWeight,70),quantWeight:pc(w.quantWeight,60)};
    for(const k in out.comps) out.comps[k]=+out.comps[k]||0;
    out.grades.D.min=0;
    const id=c?.id||('c'+uid()); sb.disabled=true;
    try{ await put('cycles',id,out); ui.cycleId=id; ui.evOpen=true; closeDlg(); render(); }catch(_){ sb.disabled=false; }
  }
  function paint(){
    openDlg(`<div class="form"><header><div><h2>${isNew?'평가 만들기':'평가 설정'}</h2><p>${step+1} / 8 · ${STEPS[step]}</p></div><button class="x" data-act="close" aria-label="닫기">×</button></header><div class="wz"><div class="wzs" role="group" aria-label="설정 단계">${STEPS.map((s,i)=>`<button type="button" data-step="${i}" aria-pressed="${i===step}"><span class="n">${i+1}</span>${s}</button>`).join('')}</div><div class="body" id="wzb">${B[step]()}</div></div><footer>${isNew?'':'<button type="button" class="btn danger" id="wdel">삭제</button>'}<p class="err" id="wErr" hidden></p><span class="sp"></span><button type="button" class="btn ghost" data-wz="-1"${step?'':' disabled'}>이전</button><button type="button" class="btn" data-wz="1"${step<7?'':' disabled'}>다음</button><button type="button" class="btn primary" data-save="cycle">${isNew?'평가 만들기':'저장'}</button></footer></div>`,true);
    dlg.oninput=e=>{ const t=e.target;
      if(t.dataset.wc){ if(t.checked) w.comps[t.dataset.wc]=10; else delete w.comps[t.dataset.wc]; }
      else if(t.dataset.w) setP(w,t.dataset.w,t.type==='checkbox'?t.checked:t.type==='number'?(t.value===''?'':+t.value):t.value);
      else return;
      if(t.type==='checkbox'||t.type==='radio') $('#wzb').innerHTML=B[step]();
      else if(t.dataset.w.startsWith('comps.')){ const s=$('#wsum'); if(s) s.innerHTML=wsum(); } };
    dlg.onclick=async e=>{
      const s=e.target.closest('[data-step]'); if(s){ step=+s.dataset.step; paint(); return; }
      const z=e.target.closest('[data-wz]'); if(z){ step=Math.max(0,Math.min(7,step+ +z.dataset.wz)); paint(); return; }
      const sb=e.target.closest('[data-save]'); if(sb){ save(sb); return; }
      if(e.target.id==='wdel'){ const b=e.target;
        if(S.evals.some(x=>x.cycleId===c.id)||S.reviews.some(x=>x.cycleId===c.id)){ toast('평가 기록이 있는 평가는 삭제할 수 없습니다. 진행 상태를 마감으로 바꿔 두세요.',1); return; }
        if(b.dataset.armed!=='1'){ b.dataset.armed='1'; b.textContent='한 번 더 누르면 삭제됩니다'; return; }
        try{ await del('cycles',c.id); ui.cycleId=null; ui.evOpen=false; closeDlg(); render(); }catch(_){} } };
  }
  paint();
}

/* 역량 평가지: 단계(셀프·동료·하향)별로 한 사람당 한 장 */
function openReview(st,pid){
  const c=curCycle(), p=by(S.people,pid), sg=STG.find(s=>s[0]===st); if(!c||!p||!sg) return;
  const id=revId(c,st,pid), ex=by(S.reviews,id), cs=compsFor(c,p), label=sg[1];
  const d=ex?JSON.parse(JSON.stringify(strip(ex))):{cycleId:c.id,stage:st,targetId:pid,reviewerId:'',scores:{},notes:{},comment:'',status:'draft'};
  d.scores=d.scores||{}; d.notes=d.notes||{};
  const lead=by(S.people,by(S.orgs,p.orgId)?.lead);
  if(!d.reviewerId) d.reviewerId=st==='self'?pid:st==='down'&&lead&&lead.id!==pid?lead.id:'';
  const others=STG.filter(s=>s[0]!==st&&stOn(c,s[0])).map(s=>[s[1].slice(0,2),getRev(c,s[0],pid)]).filter(x=>x[1]?.status==='done');
  const ref=k=>{ const t=others.map(([l,rv])=>+rv.scores?.[k.id]>=1?`${l} ${+rv.scores[k.id]}`:'').filter(Boolean).join(' · '); return t?` · 참고: ${t}`:''; };
  const txt='style="font-family:var(--font);font-size:15px"';
  const sum=()=>{ const s=revScore(c,d,p); return `<div><span>역량 점수</span><b>${fmt(s.score)}</b></div><div><span>입력</span><b>${s.filled}/${s.count}</b></div><div><span>단계</span><b ${txt}>${label}</b></div><div><span>상태</span><b ${txt}>${ex?(ex.status==='done'?'제출':'작성 중'):'미제출'}</b></div>`; };
  const by_=st==='self'?`<b>${esc(p.name)}</b> 본인`:`<select id="rvBy" data-rv="by"><option value="">선택하세요</option>${activePeople().filter(x=>x.id!==pid).map(x=>`<option value="${x.id}"${d.reviewerId===x.id?' selected':''}>${esc(x.name)}</option>`).join('')}</select>`;
  openDlg(`<div class="form"><header><div><h2>${esc(p.name)} · ${label}${exTag(ex)}</h2><p>${esc(c.name)} · ${posOf(p)}</p></div><button class="x" data-act="close" aria-label="닫기">×</button></header><div class="body">
    <div class="evsum" id="rvSum">${sum()}</div>
    <label class="inl" for="rvBy">평가자 ${by_}</label>
    ${cs.length?CTYPES.map(t=>{ const g=cs.filter(k=>k.type===t); return g.length?`<div class="sec"><h3>${t} 역량 <span>5 탁월 · 4 우수 · 3 충족 · 2 미흡 · 1 부족</span></h3>${g.map(k=>`<div class="lrow"><div class="top"><div><b>${esc(k.name)}</b><small>${esc(k.def||'')} · 가중치 ${+c.comps[k.id]||0}${ref(k)}</small></div><div class="rate" role="group" aria-label="${esc(k.name)} 점수">${[1,2,3,4,5].map(n=>`<button type="button" data-rc="${k.id}" data-v="${n}" aria-pressed="${+d.scores[k.id]===n}">${n}</button>`).join('')}</div></div><textarea id="rn_${k.id}" rows="1" data-rn="${k.id}" placeholder="점수의 근거가 된 사례를 적습니다">${esc(d.notes[k.id]||'')}</textarea></div>`).join('')}</div>`:''; }).join(''):'<p class="dim">이 평가에 고른 역량이 없습니다. 설정 4단계에서 역량을 고르세요.</p>'}
    <label class="fld"><span>종합 코멘트</span><textarea id="rvC" rows="2" data-rv="comment">${esc(d.comment||'')}</textarea></label>
    <p class="err" id="rvErr" hidden></p>
  </div><footer><small class="dim">${ex?.updatedAt?'마지막 저장 '+esc(ex.updatedAt):''}</small><span class="sp"></span><button class="btn ghost" data-act="close">닫기</button><button class="btn" data-save="draft">임시 저장</button><button class="btn primary" data-save="done">제출</button></footer></div>`,true);
  dlg.oninput=e=>{ const x=e.target.dataset; if(x.rn) d.notes[x.rn]=e.target.value; else if(x.rv==='comment') d.comment=e.target.value; else if(x.rv==='by') d.reviewerId=e.target.value; };
  dlg.onclick=async e=>{
    const rb=e.target.closest('[data-rc]');
    if(rb){ const v=+rb.dataset.v, k=rb.dataset.rc; if(+d.scores[k]===v) delete d.scores[k]; else d.scores[k]=v; rb.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.v===+d.scores[k]))); $('#rvSum').innerHTML=sum(); return; }
    const sb=e.target.closest('[data-save]'); if(!sb) return;
    const stt=sb.dataset.save, s=revScore(c,d,p), err=$('#rvErr');
    if(stt==='done'){ const m=!s.count?'평가할 역량이 없습니다.':s.filled<s.count?`점수를 주지 않은 역량이 ${s.count-s.filled}개 있습니다. 모두 채운 뒤 제출하세요.`:c.requireNote&&cs.some(k=>!String(d.notes[k.id]||'').trim())?'모든 역량에 근거 코멘트를 적어야 제출할 수 있습니다.':''; if(m){ err.textContent=m; err.hidden=false; return; } }
    sb.disabled=true; try{ await put('reviews',id,{...d,status:stt,updatedAt:today()}); closeDlg(); }catch(_){ sb.disabled=false; }
  };
}

/* 성과 평가지 */
function openEval(type,tid){
  const cyc=curCycle(), t=type==='person'?by(S.people,tid):by(S.orgs,tid); if(!cyc||!t) return;
  const id=evalId(cyc,type,tid), ex=by(S.evals,id);
  const d=ex?JSON.parse(JSON.stringify(strip(ex))):{cycleId:cyc.id,type,targetId:tid,quant:{},qual:{},strengths:'',improve:'',next:'',status:'draft'};
  d.quant=d.quant||{}; d.qual=d.qual||{};
  const ms=S.metrics.filter(m=>m.scope===type&&m.active!==false), qn=ms.filter(m=>m.kind==='quant'), ql=ms.filter(m=>m.kind==='qual');
  const sumHTML=()=>{const s=scoreEval(d,type,cyc);return `<div><span>정량 (${cyc.quantWeight??60}%)</span><b>${fmt(s.quant)}</b></div><div><span>정성 (${100-(cyc.quantWeight??60)}%)</span><b>${fmt(s.qual)}</b></div><div><span>성과 점수</span><b>${fmt(s.total)}</b></div><div><span>등급 · 입력 ${s.filled}/${s.count}</span><b>${grade(s.total)||'–'}</b></div>`;};
  const rateTxt=m=>{const r=quantRate(m,d.quant[m.id]);return r==null?'–':Math.round(r*100)+'%';};
  openDlg(`<div class="form"><header><div><h2>${esc(t.name)} 평가${exTag(t)}</h2><p>${esc(cyc.name)} · ${type==='person'?esc(orgName(t.orgId))+' '+esc(t.title||''):'조직 평가'}</p></div><button class="x" data-act="close" aria-label="닫기">×</button></header><div class="body">
    <div class="evsum" id="evSum">${sumHTML()}</div>
    <div class="sec"><h3>정량 지표 <span>달성률 = 실적 ÷ 목표 (최대 120%)</span></h3>${qn.length?`<div class="qrow hd"><span>지표</span><span>목표</span><span>실적</span><span style="text-align:right">달성률</span></div>`+qn.map(m=>`<div class="qrow"><div><b>${esc(m.name)}</b><small>${esc(m.unit||'')} · 가중치 ${+m.weight||0}${m.dir==='down'?' · 낮을수록 좋음':''}</small></div><input id="qt_${m.id}" aria-label="${esc(m.name)} 목표" inputmode="decimal" data-q="${m.id}" data-f="target" value="${esc(d.quant[m.id]?.target??'')}"><input id="qa_${m.id}" aria-label="${esc(m.name)} 실적" inputmode="decimal" data-q="${m.id}" data-f="actual" value="${esc(d.quant[m.id]?.actual??'')}"><output id="r_${m.id}">${rateTxt(m)}</output></div>`).join(''):'<p class="dim">사용 중인 정량 지표가 없습니다. 성과 지표 메뉴에서 추가하세요.</p>'}</div>
    <div class="sec"><h3>정성 지표 <span>5 탁월 · 4 우수 · 3 충족 · 2 미흡 · 1 부족</span></h3>${ql.length?ql.map(m=>`<div class="lrow"><div class="top"><div><b>${esc(m.name)}</b><small>${esc(m.desc||'')} · 가중치 ${+m.weight||0}</small></div><div class="rate" role="group" aria-label="${esc(m.name)} 점수">${[1,2,3,4,5].map(n=>`<button type="button" data-rate="${m.id}" data-v="${n}" aria-pressed="${+d.qual[m.id]?.score===n}">${n}</button>`).join('')}</div></div><textarea id="ln_${m.id}" rows="1" data-note="${m.id}" placeholder="점수의 근거가 된 사례를 적습니다">${esc(d.qual[m.id]?.note||'')}</textarea></div>`).join(''):'<p class="dim">사용 중인 정성 지표가 없습니다.</p>'}</div>
    <div class="sec"><h3>총평 </h3><div class="fgrid">
      <label class="fld"><span>강점</span><textarea id="ev_strengths" rows="2" data-tx="strengths">${esc(d.strengths||'')}</textarea></label>
      <label class="fld"><span>보완점</span><textarea id="ev_improve" rows="2" data-tx="improve">${esc(d.improve||'')}</textarea></label>
      <label class="fld"><span>다음 주기 목표</span><textarea id="ev_next" rows="2" data-tx="next">${esc(d.next||'')}</textarea></label></div></div>
    <p class="err" id="evErr" hidden></p>
  </div><footer><small class="dim">${ex?.updatedAt?'마지막 저장 '+esc(ex.updatedAt):''}</small><span class="sp"></span><button class="btn ghost" data-act="close">닫기</button><button class="btn" data-save="draft">임시 저장</button><button class="btn primary" data-save="done">확정</button></footer></div>`,true);
  const refresh=()=>{ $('#evSum').innerHTML=sumHTML(); qn.forEach(m=>{$('#r_'+m.id).textContent=rateTxt(m);}); };
  dlg.oninput=e=>{ const x=e.target.dataset; if(x.q){ (d.quant[x.q]=d.quant[x.q]||{})[x.f]=e.target.value.trim(); refresh(); } else if(x.note){ (d.qual[x.note]=d.qual[x.note]||{}).note=e.target.value; } else if(x.tx){ d[x.tx]=e.target.value; } };
  dlg.onclick=async e=>{
    const rb=e.target.closest('[data-rate]');
    if(rb){ const q=d.qual[rb.dataset.rate]=d.qual[rb.dataset.rate]||{}; const v=+rb.dataset.v; q.score=q.score===v?null:v; rb.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.v===q.score))); refresh(); return; }
    const sb=e.target.closest('[data-save]');
    if(sb){ const st=sb.dataset.save, s=scoreEval(d,type,cyc), err=$('#evErr');
      if(st==='done'&&!s.complete){ err.textContent=`입력하지 않은 지표가 ${s.count-s.filled}개 있습니다. 모두 채운 뒤 확정하세요. 지금은 임시 저장만 됩니다.`; err.hidden=false; return; }
      const out={...d,status:st,updatedAt:today()};
      for(const k in out.quant){ const v=out.quant[k]; out.quant[k]={target:v.target===''||v.target==null||isNaN(+v.target)?'':+v.target,actual:v.actual===''||v.actual==null||isNaN(+v.actual)?'':+v.actual}; }
      sb.disabled=true; try{ await put('evals',id,out); closeDlg(); }catch(_){ sb.disabled=false; } return; }
  };
}

/* ───────── 화면: 평가 지표 ───────── */
const GROUPS=[['person','quant','구성원 정량'],['person','qual','구성원 정성'],['org','quant','조직 정량'],['org','qual','조직 정성']];
function wSums(){ return GROUPS.map(([sc,k,label])=>{const ms=S.metrics.filter(m=>m.scope===sc&&m.kind===k&&m.active!==false);return {label,n:ms.length,sum:ms.reduce((a,m)=>a+(+m.weight||0),0)};}); }
function vMetrics(){

  if(!S.metrics.length) return h+empty('성과 지표가 없습니다','정량 지표(목표 대비 실적)와 정성 지표(5점 척도)를 추가하세요.','<button class="btn primary" data-act="metricNew">첫 지표 만들기</button>');

    <tr><td><b>정량 점수</b></td><td>지표별 달성률(실적 ÷ 목표, 낮을수록 좋은 지표는 목표 ÷ 실적)을 0~120%로 제한한 뒤 가중 평균</td></tr>
    <tr><td><b>정성 점수</b></td><td>지표별 5점 척도 × 20을 가중 평균 (5점 = 100점)</td></tr>
    <tr><td><b>성과 점수</b></td><td>정량 × 정량 비중 + 정성 × 정성 비중. 비중은 평가마다 정합니다</td></tr>
    <tr><td><b>종합 점수</b></td><td>역량 평가를 함께 쓰는 평가에서는 성과 점수와 역량 점수를 평가 설정의 비중으로 합칩니다</td></tr>
    <tr><td><b>등급</b></td><td>${GR().map(g=>`${g[0]} ${g[1]}점 이상`).join(' · ')}</td></tr></tbody></table></div></section>
    <section class="panel"><h2>정성 5점 척도</h2><div class="scroll"><table style="min-width:360px"><tbody>${SCALE.map(s=>`<tr><td class="n" style="width:32px"><b>${s[0]}</b></td><td style="width:56px">${s[1]}</td><td>${s[2]}</td></tr>`).join('')}</tbody></table></div></section></div>`;
  return h;

function vGoal(){
  let h=head('목표','회사 목표를 조직과 개인 목표로 나누고 진행률을 관리합니다.','<button class="btn primary" data-act="goalNew">목표 추가</button>')+statusStrip();
  if(!S.goals.length) return h+empty('등록된 목표가 없습니다','회사 목표를 먼저 만들고, 그 아래에 조직과 개인 목표를 연결하세요.','<button class="btn primary" data-act="goalNew">첫 목표 만들기</button>');
  const f=ui.goalTab, n=t=>S.goals.filter(g=>g.ownerType===t).length;
  h+=ptabs('goalTab',[['','전체 목표 '+S.goals.length],['회사','회사 '+n('회사')],['조직','조직 '+n('조직')],['개인','개인 '+n('개인')]],f);
  const rows=[], seen=new Set();
  const walk=(g,d)=>{ if(seen.has(g.id)) return; seen.add(g.id); rows.push([g,d]); S.goals.filter(x=>x.parent===g.id).forEach(x=>walk(x,d+1)); };
  if(f) S.goals.filter(g=>g.ownerType===f).forEach(g=>rows.push([g,0]));
  else{ S.goals.filter(g=>!g.parent||!by(S.goals,g.parent)).forEach(g=>walk(g,0)); S.goals.forEach(g=>walk(g,0)); }
  const act=S.goals.filter(g=>g.status!=='보류'), avg=mean(act.map(g=>+g.progress||0));

/* 기준: 출근 09:00, 하루 8시간, 주 40시간, 연장 포함 주 52시간 한도 */
const STD={in:'09:00',week:2400,cap:3120};
const wlDoc = (pid,wk)=>by(S.worklogs,pid+'_'+wk);
const wkCut = ()=>monOf(addDays(today(),-182));
function wkStat(p,wk){
  const t=today(), d=wlDoc(p.id,wk)?.days||{}, ins=[], outs=[]; let tot=0,rec=0,late=0,rest=0,we=0,miss=0,lv=0;
  for(let i=0;i<7;i++){ const iso=addDays(wk,i), x=d[iso], w=dow(iso), wkend=w===0||w===6, off=!!offOn(p.id,iso), n=netMin(x);
    if(off&&!wkend) lv++;
    if(n>0){ tot+=n; rec++; ins.push(tmin(x.s)); outs.push(tmin(x.e)); if(!wkend&&!off&&tmin(x.s)>tmin(STD.in)) late++; if((n>=480&&(+x.r||0)<60)||(n>=240&&(+x.r||0)<30)) rest++; if(wkend) we++; }
    else if(!wkend&&!off&&iso<=t&&(!p.joined||p.joined<=iso)) miss++; }
  return {tot,rec,late,rest,we,miss,lv,in:mean(ins),out:mean(outs)};
}
function vWork(){
  const cur=monOf(today()), wk=ui.wkWeek||cur, act=activePeople();
  const nav=`<span class="calnav"><button class="btn sm" data-act="wkMove" data-d="-1"${wk<=wkCut()?' disabled':''} aria-label="이전 주">←</button><b style="min-width:124px">${md(wk)} – ${md(addDays(wk,6))}</b><button class="btn sm" data-act="wkMove" data-d="1" aria-label="다음 주">→</button><button class="btn sm" data-act="wkMove" data-d="0">이번 주</button></span>`;
  let h=head('근무','출퇴근 기록을 주 단위로 남기고, 근태 대시보드에서 전체 현황을 확인합니다.',nav)+statusStrip();
  if(!act.length) return h+empty('구성원이 없습니다','구성원 메뉴에서 구성원을 등록하면 근무를 기록할 수 있습니다.','<a class="btn primary" href="#org">구성원 등록하기</a>');
  h+=ptabs('wkTab',[['','근무 기록'],['dash','근태 대시보드']],ui.wkTab);
  return h+(ui.wkTab==='dash'?workDash(wk,act):workLog(wk,act));
}
function workLog(wk,act){
  const p=by(act,ui.wkPerson)||act[0], t=today(), st=wkStat(p,wk), days=wlDoc(p.id,wk)?.days||{};
  const T0=360,T1=1440, pos=m=>(Math.max(T0,Math.min(T1,m))-T0)/(T1-T0)*100;
  let h=`<div class="va" style="justify-content:space-between"><label class="inl">구성원<select id="wkSel" data-chg="wkPerson">${act.map(x=>`<option value="${x.id}"${x.id===p.id?' selected':''}>${esc(x.name)}</option>`).join('')}</select></label><button class="btn" data-act="wlFill" data-p="${p.id}" data-wr>평일 기본 근무 채우기</button></div>`;
  h+=`<div class="kpis"><div class="kpi"><span>주간 근무 시간</span><b style="font-size:24px">${dur(st.tot)}</b><small>소정 40시간${st.tot>STD.week?' · 연장 '+dur(st.tot-STD.week):''}</small></div>
    <div class="kpi"><span>기록한 날</span><b>${st.rec}<i>일</i></b><small>${st.miss?'평일 누락 '+st.miss+'일':'누락 없음'}${st.lv?' · 휴가 '+st.lv+'일':''}</small></div>
    <div class="kpi"><span>평균 출근</span><b>${hhmm(st.in)}</b><small>기준 ${STD.in}${st.late?' · 지각 '+st.late+'일':''}</small></div>
    <div class="kpi"><span>주 52시간까지</span><b style="font-size:24px">${st.tot>STD.cap?'초과':dur(STD.cap-st.tot)}</b><small>${st.tot>STD.cap?dur(st.tot-STD.cap)+' 넘었습니다':'연장 근로 포함 한도'}</small></div></div>`;
  let rows='';
  for(let i=0;i<7;i++){ const iso=addDays(wk,i), x=days[iso], w=dow(iso), n=netMin(x), off=offOn(p.id,iso);
    rows+=`<div class="wlr${iso===t?' td':''}${w===0||w===6?' we':''}"><div class="wld"><span class="n">${md(iso)}</span> ${DOWK[w]}</div><div class="wlt">${n>0?`<i class="wlb" style="left:${pos(tmin(x.s)).toFixed(2)}%;width:${(pos(tmin(x.e))-pos(tmin(x.s))).toFixed(2)}%" data-tip="${esc(x.s)} – ${esc(x.e)} · 휴게 ${+x.r||0}분"></i>`:''}${off&&w!==0&&w!==6?`<span class="lv wll">${esc(off.type)}</span>`:''}</div><div class="wlh">${n>0?`<b class="n">${dur(n)}</b><small class="n">${esc(x.s)}–${esc(x.e)}</small>`:'<span class="dim">기록 없음</span>'}</div><div><button class="btn sm" data-act="wlEdit" data-p="${p.id}" data-d="${iso}">${n>0?'수정':'기록'}</button></div></div>`; }
  h+=`<section class="panel"><h2>${esc(p.name)} 주간 근무${exTag(wlDoc(p.id,wk))} <small>06시 – 24시</small></h2><div class="scroll"><div class="wl"><div class="wlr ax"><div></div><div class="wla">${[6,9,12,15,18,21,24].map((x,i)=>`<span style="left:${(i/6*100).toFixed(2)}%">${x}</span>`).join('')}</div><div></div><div></div></div>${rows}</div></div><p class="fine" style="margin-top:10px">근무 시간은 퇴근에서 출근과 휴게를 뺀 시간입니다. 4시간 근무에는 30분, 8시간 근무에는 1시간 이상 휴게가 필요합니다.</p></section>`;
  return h;
}
function workDash(wk,act){
  const rows=act.map(p=>({p,s:wkStat(p,wk)})), avg=k=>mean(rows.map(r=>r.s[k]).filter(x=>x!=null));
  const tot=sumBy(rows,r=>r.s.tot), rec=sumBy(rows,r=>r.s.rec), names=f=>rows.filter(f).map(r=>esc(r.p.name));
  let h=`<div class="kpis"><div class="kpi"><span>평균 출근</span><b>${hhmm(avg('in'))}</b><small>기준 ${STD.in}</small></div><div class="kpi"><span>평균 퇴근</span><b>${hhmm(avg('out'))}</b><small>기록이 있는 구성원 평균</small></div><div class="kpi"><span>일 평균 근무</span><b style="font-size:24px">${rec?dur(tot/rec):'–'}</b><small>기록 ${rec}일 기준</small></div></div>`;
  const chk=[['근무 기록 누락','오늘까지 평일인데 근무도 휴가도 없는 구성원',r=>r.s.miss>0,'warn'],['주 40시간 초과','소정 근무 시간을 넘긴 구성원',r=>r.s.tot>STD.week&&r.s.tot<=STD.cap,'warn'],['주 52시간 초과','연장 근로를 포함한 법정 한도를 넘긴 구성원',r=>r.s.tot>STD.cap,'bad'],['휴게 시간 부족','법정 휴게 기준에 못 미친 날이 있는 구성원',r=>r.s.rest>0,'warn'],['지각',STD.in+' 이후에 근무를 시작한 구성원',r=>r.s.late>0,'warn'],['휴일 근무','토요일이나 일요일에 근무한 구성원',r=>r.s.we>0,'acc'],['휴가 사용','승인된 휴가가 있는 구성원',r=>r.s.lv>0,'acc']];
  h+=`<section class="panel"><h2>근태 현황 <small>${md(wk)} – ${md(addDays(wk,6))}</small></h2><ul class="todo">${chk.map(([l,d,f,c])=>{ const ns=names(f); return `<li><div class="t"><b>${l}</b><small>${ns.length?ns.join(', '):d}</small></div><span class="pill${ns.length?' '+c:''}">${ns.length}명</span></li>`; }).join('')}</ul></section>`;
  h+=`<section class="panel"><h2>구성원별 근무 시간 <small>막대 끝은 52시간, 세로선은 40시간</small></h2><div class="scroll"><table style="min-width:640px"><thead><tr><th>구성원</th><th>주간 근무 시간</th><th class="r">기록일</th><th>평균 출근</th><th>평균 퇴근</th><th>확인할 점</th></tr></thead><tbody>${rows.map(({p,s})=>{ const f=[]; if(s.tot>STD.cap) f.push('<span class="pill bad">52시간 초과</span>'); else if(s.tot>STD.week) f.push('<span class="pill warn">연장 '+dur(s.tot-STD.week)+'</span>'); if(s.miss) f.push('<span class="pill warn">누락 '+s.miss+'일</span>'); if(s.late) f.push('<span class="pill">지각 '+s.late+'일</span>'); if(s.rest) f.push('<span class="pill">휴게 부족</span>'); if(s.we) f.push('<span class="pill acc">휴일 근무 '+s.we+'일</span>');
    return `<tr><td>${who(p,posOf(p))}</td><td><span class="sbar"><span class="bar t40"><i class="${s.tot>STD.cap?'bd':s.tot>STD.week?'wn':''}" style="width:${Math.min(100,s.tot/STD.cap*100).toFixed(1)}%"></i></span><b style="width:74px">${dur(s.tot)}</b></span></td><td class="r n">${s.rec}일</td><td class="n">${hhmm(s.in)}</td><td class="n">${hhmm(s.out)}</td><td>${f.join(' ')||'<span class="dim">–</span>'}</td></tr>`; }).join('')}</tbody></table></div></section>`;
  return h;
}
async function saveDays(pid,wk,days){ const doc=wlDoc(pid,wk); const ok=await save('worklogs',pid+'_'+wk,{...strip(doc||{}),personId:pid,week:wk,days}); if(!ok) throw 0; }

async function wlFill(pid){

const shDoc = (pid,ym)=>by(S.shifts,pid+'_'+ym);

async function flStep(d){ const a=by(S.approvals,d.id); if(!a) return;

  if(d.v==='no'){ await patch('approvals',a.id,{state:'반려',decided:today()}); toast('반려했습니다'); return; }
  const n=(+a.step||0)+1, end=n>=(a.line||[]).length; await patch('approvals',a.id,end?{step:n,state:'완료',decided:today()}:{step:n}); toast(end?'결재가 완료됐습니다':'승인했습니다. 다음 결재자 차례입니다'); }

document.addEventListener('click',e=>{ const el=e.target.closest('[data-act]'); if(!el) return; const f=A[el.dataset.act]; if(f){ if(el.tagName==='BUTTON') e.preventDefault(); f(el.dataset,el); } });
document.addEventListener('change',e=>{ const f=C[e.target.dataset?.chg]; if(f) f(e.target); });
dlg.addEventListener('close',()=>{ dlg.innerHTML=''; dlg.oninput=null; dlg.onclick=null; });
window.addEventListener('hashchange',route);

async function boot(){
  loadLocal(); route();
  if(!gasUrl()){ loadState='local'; setRo(false); render(); return; }
  loadState='loading'; setRo(true); render();
  await syncAll();
}
/* 다른 사람이 고친 내용을 받아 옵니다: 2분마다, 그리고 창으로 돌아왔을 때 */
setInterval(()=>{ if(document.visibilityState==='visible'&&!dlg.open&&loadState!=='loading') syncAll(true); },120000);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&!dlg.open&&loadState!=='loading') syncAll(true); });
boot();
</script>
